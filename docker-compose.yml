services:
  api:
    build: ./backend
    image: lithub-pavilion-api:local
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - lithub-data:/app/data
      - ./seeds:/app/seeds:ro
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: sqlite:////app/data/papers.db
      SEEDS_DIR: /app/seeds
      INITIALIZE_ON_STARTUP: "true"
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      STARTUP_CRAWL_ENABLED: ${STARTUP_CRAWL_ENABLED:-true}
      STARTUP_YEAR_FROM: ${STARTUP_YEAR_FROM:-2023}
      STARTUP_YEAR_TO: ${STARTUP_YEAR_TO:-}
      SNAPSHOT_ENABLED: ${SNAPSHOT_ENABLED:-true}
      SNAPSHOT_DIR: /app/data/snapshot
      PAGES_PUBLISH_ENABLED: ${PAGES_PUBLISH_ENABLED:-false}
      PAGES_REPOSITORY: ${PAGES_REPOSITORY:-scyolo/LitHub-Pavilion}
      PAGES_TOKEN_FILE: /run/secrets/github_token
      PAGES_RETRY_SECONDS: ${PAGES_RETRY_SECONDS:-300}
      PAGES_DEPLOY_RETRY_SECONDS: ${PAGES_DEPLOY_RETRY_SECONDS:-1800}
      PAGES_SITE_URL: ${PAGES_SITE_URL:-}
      PDF_DOWNLOAD_ENABLED: "false"
      S2_API_KEY: ${S2_API_KEY:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      LINKS_MAX_BATCHES: ${LINKS_MAX_BATCHES:-20}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    expose:
      - "8000"
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      start_period: 30s
      interval: 15s
      timeout: 6s
      retries: 5
  web:
    build: ./frontend
    image: lithub-pavilion-web:local
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - lithub-data:/var/lib/lithub:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 20s
      timeout: 5s
      retries: 3
volumes:
  lithub-data:
