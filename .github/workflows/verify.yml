name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app scripts tests --select F,E9
      - run: python -m pytest -o addopts= --disable-warnings
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit
      - run: npm test
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start an empty installation
        env:
          SCHEDULER_ENABLED: 'false'
          WEB_PORT: '8180'
        run: docker compose -p lithub-ci up -d --build --wait --wait-timeout 180
      - name: Verify empty application
        run: python scripts/smoke_release.py
      - name: Container diagnostics
        if: failure()
        run: docker compose -p lithub-ci logs --no-color
      - name: Stop isolated test containers
        if: always()
        run: docker compose -p lithub-ci down
