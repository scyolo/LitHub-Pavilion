name: Publish reader snapshot
on:
  repository_dispatch:
    types: [snapshot-updated]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/app/services/snapshot.py'
      - 'scripts/prepare_pages.py'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: vars.PAGES_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      snapshot_commit: ${{ steps.select.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select the latest complete data revision
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_HOST: github.com
          GH_PROMPT_DISABLED: '1'
          DISPATCHED_COMMIT: ${{ github.event.client_payload.snapshot_commit }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$DISPATCHED_COMMIT" && ! "$DISPATCHED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Invalid dispatched commit\n' >&2
            exit 1
          fi
          latest=$(gh api "repos/$GH_REPO/git/ref/heads/site-data" --jq '.object.sha')
          [[ "$latest" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit=%s\n' "$latest" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.select.outputs.commit }}
          path: snapshot-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Validate and stage only public metadata
        run: python scripts/prepare_pages.py snapshot-source/snapshot frontend/static/snapshot
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build the backend-free reader
        working-directory: frontend
        env:
          VITE_DATA_MODE: snapshot
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
